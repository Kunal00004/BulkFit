# =========================================
# BulkFit Backend Configuration
# =========================================

spring.application.name=bulkfit-backend
server.port=8080

# ---------- MySQL DataSource ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
# 256-bit base64 secret - replace in production via env var BULKFIT_JWT_SECRET
bulkfit.app.jwtSecret=${BULKFIT_JWT_SECRET:c3VwZXJTZWNyZXRCdWxrRml0S2V5Rm9ySldUU2lnbmluZzIwMjZQcm9kdWN0aW9uUmVhZHk=}
bulkfit.app.jwtExpirationMs=86400000

# ---------- CORS ----------
# ---------- CORS ----------
bulkfit.app.corsAllowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://bulk-fit.vercel.app}

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.bulkfit=DEBUG

bulkfit.ai.groq.apiKey=${GROQ_API_KEY}
bulkfit.ai.openrouter.apiKey=${OPENROUTER_API_KEY}