# =========================================
# BulkFit Backend Configuration
# =========================================

spring.application.name=bulkfit-backend
server.port=8080

# ---------- MySQL DataSource ----------
spring.datasource.url=jdbc:mysql://localhost:3306/bulkfit_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Banna sa
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- JWT ----------
# 256-bit base64 secret - replace in production via env var BULKFIT_JWT_SECRET
bulkfit.app.jwtSecret=${BULKFIT_JWT_SECRET:c3VwZXJTZWNyZXRCdWxrRml0S2V5Rm9ySldUU2lnbmluZzIwMjZQcm9kdWN0aW9uUmVhZHk=}
bulkfit.app.jwtExpirationMs=86400000

# ---------- CORS ----------
bulkfit.app.corsAllowedOrigins=http://localhost:5173,http://localhost:5174

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.bulkfit=DEBUG

bulkfit.ai.groq.apiKey=${GROQ_API_KEY}
bulkfit.ai.openrouter.apiKey=${OPENROUTER_API_KEY}